# docker-compose.yml
# Owner: Antigravity AI Assistant — Milestone 5 (containerised microservice deployment)
#
# Usage:
#   docker-compose up --build -d       # start all services in background
#   docker-compose down                # stop and remove containers

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Local LLM service running via GPU
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ukaht-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Algorithm Inference Service (CLIP, BLIP, polar adapter, LangChain Agent)
  # ---------------------------------------------------------------------------
  algorithm:
    build:
      context: .
      dockerfile: Dockerfile.algorithm
    container_name: ukaht-algorithm
    ports:
      - "8001:8001"
    volumes:
      # Mount source code for hot reloading
      - ./algorithm:/app/algorithm
      # Share the backend static directory to read uploads directly via file paths
      - ./backend/static:/app/backend/static
    command: uvicorn algorithm.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - UKAHT_LLM_MODEL=gemma4:e4b
      - UKAHT_LLM_BASE_URL=http://ollama:11434/v1
      - UKAHT_LLM_API_KEY=ollama
      - BACKEND_API_BASE=http://backend:8000
      - UKAHT_STATIC_DIR=/app/backend/static
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - ollama
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend API Gateway & Database (FastAPI + PostgreSQL + React SPA Static Files)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ukaht-backend
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reloading
      - ./backend:/app/backend
      # Mount dataset directory (read-only) so paths inside the container match
      - ./UK Antarctic Heritage Trust Data:/data:ro
      # Mount AWS credentials for S3 uploads
      - ~/.aws:/root/.aws:ro
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - UKAHT_DATA_DIR=/data
      - ALGO_API_BASE=http://algorithm:8001
      - UKAHT_LLM_MODEL=gemma4:e4b
      - UKAHT_LLM_BASE_URL=http://ollama:11434/v1
      - UKAHT_LLM_API_KEY=ollama
      - UKAHT_S3_BUCKET=${UKAHT_S3_BUCKET}
      - UKAHT_S3_REGION=${UKAHT_S3_REGION}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ukaht
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - algorithm
      - db
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ukaht-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ukaht
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

